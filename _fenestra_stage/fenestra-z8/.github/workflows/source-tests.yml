name: source-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-z8.txt -r requirements-host.txt
      - run: python -B verify_z8_source.py
      - run: python -c "from pathlib import Path; Path('build').mkdir(exist_ok=True)"
      - run: python -B -m unittest discover -s tests -v
