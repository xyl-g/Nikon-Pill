name: Build Nikon Pill

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write        # needed for the tag -> Release upload

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # git describe needs the tags
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PySide6 capstone==5.0.7
      - run: zsh build-macos.sh
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: NikonPill-macOS
          path: dist/NikonPill-*-macOS.dmg
      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NikonPill-*-macOS.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # git describe needs the tags
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PySide6 capstone==5.0.7
      - shell: cmd
        run: build-windows.bat
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: NikonPill-Windows
          path: dist/NikonPill-*-Windows.exe
      - name: Attach EXE to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NikonPill-*-Windows.exe
